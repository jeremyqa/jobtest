[project]
name = "jobproject"
version = "2.0.0"
requires-python = ">=3.14"
dependencies = [
    "django~=6.1",
    "django-cors-headers==4.7.0",
    "django-filter==25.1",
    "djangorestframework~=3.18",
    "djangorestframework-csv==3.0.2",
    "djangorestframework-queryfields==1.1.0",
    "djangorestframework-simplejwt[crypto]>=5.5.1",
    "psycopg[binary]==3.3.8",
    "python-dotenv~=1.2",
    "waitress==3.0.2",
]

[tool.ruff]
line-length = 120
exclude = [
    "manage.py",
]

[tool.ruff.lint]
extend-select = [
    "DJ",       # flake8-django: Django-specific bugs
    "E",        # pycodestyle errors
    "F",        # Pyflakes
    "W",        # pycodestyle warnings
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
]

ignore = [
    "N999"  # invalid module name.
]  

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501", "RUF012"]
"**/models/*.py" = ["RUF012"]
"**/views/*.py" = ["RUF012"]
"**/admin/*.py" = ["RUF012"]


[dependency-groups]
dev = [
    "freezegun~=1.5",
    "pdbpp~=0.12",
    "playwright~=1.65",
    "pytest==9.2.0",
    "pytest-django~=4.10",
    "pytest-playwright>=0.10.0",
    "ruff~=0.17",
]

[tool.pytest]
DJANGO_SETTINGS_MODULE = "jobproject.settings"
strict_markers = true
markers = [
    "browser: Browser tests, like with playwright"
]